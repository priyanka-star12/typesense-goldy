
name: Typesense Python CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  check-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Check JSON files
        run: |
          python -m json.tool Book.Json > /dev/null
          python -m json.tool Readers.json > /dev/null

      - name: Check notebook files
        run: |
          python -c "import json; json.load(open('Typesense.ipynb', encoding='utf-8'))"
          python -c "import json; json.load(open('agentic.ipynb', encoding='utf-8'))"
